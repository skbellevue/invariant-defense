title: AI Coding CLI Launched by Script Host or Office
id: 6f1d5a0e-2c1b-4c55-9a3e-7c2e1b0a4d05
status: experimental
description: |
  Invariant L3. Malware can drive locally installed AI agents to search for secrets (QUIETVAULT used
  on-host AI CLI tools with a prompt). Interactive tools should have interactive parents.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
author: invariant-defense
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1059
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
    Image|endswith:
      - '\claude.exe'
      - '\gemini.exe'
      - '\codex.exe'
      - '\ollama.exe'
  selection_parent:
    ParentImage|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
  condition: selection_cli and selection_parent
falsepositives:
  - Unlikely
level: high
