title: Chained Discovery Commands Writing to a Single Staging File
id: 6f1d5a0e-2c1b-4c55-9a3e-7c2e1b0a4d06
status: experimental
description: |
  Invariant L3. LLM-generated one-liners tend to chain several discovery commands and append to one
  file (LAMEHUG: C:\ProgramData\info\info.txt). Detect the shape, not the exact path.
author: invariant-defense
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1016
  - attack.collection
  - attack.t1074.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\cmd.exe'
  selection_chain:
    CommandLine|contains|all:
      - 'systeminfo'
      - '>>'
  selection_more:
    CommandLine|contains:
      - 'tasklist'
      - 'ipconfig'
      - 'whoami'
      - 'net user'
      - 'dsquery'
      - 'wmic'
  condition: all of selection_*
falsepositives:
  - Inventory scripts run by IT (should be signed and come from management agents)
level: high
