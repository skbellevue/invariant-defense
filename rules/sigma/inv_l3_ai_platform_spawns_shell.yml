title: AI Orchestration Platform Spawns Shell, Downloader or Decoder
id: 6f1d5a0e-2c1b-4c55-9a3e-7c2e1b0a4d04
status: experimental
description: |
  Invariant L3. Exploitation of Langflow (CVE-2025-3248) and similar platforms shows up on the host
  as the platform process starting sh/bash/curl/base64. JADEPUFFER entered this way.
references:
  - https://www.trendmicro.com/en_us/research/26/g/autonomous-ransomware.html
author: invariant-defense
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentCommandLine|contains:
      - 'langflow'
      - 'flowise'
      - 'n8n'
      - 'dify'
      - 'comfyui'
      - 'open-webui'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/curl'
      - '/wget'
      - '/base64'
      - '/nc'
      - '/ncat'
      - '/socat'
  condition: selection_parent and selection_child
falsepositives:
  - Custom components that legitimately shell out (document them and allow-list exact command lines)
level: high
