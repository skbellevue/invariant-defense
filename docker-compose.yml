# Local lab: run detections on a telemetry drop folder and test the database guards.
#   docker compose run --rm invariant demo --respond
#   docker compose run --rm invariant detect --events /data/telemetry.jsonl --respond
#   docker compose run --rm invariant hunt /scan --yara-dir /opt/invariant/rules/yara
services:
  invariant:
    build: .
    volumes:
      - ./telemetry:/data
      - ./scan:/scan:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: invariant
    volumes:
      - ./rules/sql:/docker-entrypoint-initdb.d/rules:ro
    ports: ["127.0.0.1:5432:5432"]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: invariant
    ports: ["127.0.0.1:3306:3306"]
